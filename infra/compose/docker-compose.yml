services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: wbstat-web:prod
    container_name: wbstat-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks:
      - caddy-net

networks:
  caddy-net:
    external: true
